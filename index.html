<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계모임 주주총회 — 삼성전자 살까?</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue-dark: #001240;
    --green-up: #00e676;
    --green-glow: rgba(0,230,118,0.18);
    --red-down: #ff3d3d;
    --white: #ffffff;
    --white-70: rgba(255,255,255,0.7);
    --white-20: rgba(255,255,255,0.12);
    --white-10: rgba(255,255,255,0.07);
  }
  html, body { min-height: 100%; background: var(--blue-dark); color: var(--white); font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden; }
  #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .ticker-wrap { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(0,230,118,0.12); border-bottom: 1px solid rgba(0,230,118,0.3); height: 32px; overflow: hidden; display: flex; align-items: center; }
  .ticker-track { display: flex; white-space: nowrap; animation: tickerMove 22s linear infinite; }
  .ticker-track span { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--green-up); padding: 0 2rem; }
  @keyframes tickerMove { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

  .page { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 52px 20px 48px; min-height: 100vh; }

  .header { text-align: center; margin-bottom: 2rem; padding-top: 1rem; }
  .header-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--white-20); border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; padding: 6px 18px; font-size: 13px; color: var(--white-70); margin-bottom: 1.25rem; }
  .header h1 { font-family: 'Black Han Sans', sans-serif; font-size: clamp(28px, 8vw, 40px); line-height: 1.2; margin-bottom: 0.5rem; }
  .header h1 em { font-style: normal; color: var(--green-up); }
  .header-sub { font-size: 14px; color: var(--white-70); }

  .price-card { background: linear-gradient(135deg, rgba(21,101,255,0.25) 0%, rgba(0,18,64,0.6) 100%); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 1.25rem 1.5rem; margin-bottom: 1.75rem; display: flex; align-items: center; justify-content: space-between; min-height: 90px; }
  .price-left .ticker-code { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--white-70); margin-bottom: 4px; }
  .price-left .price-num { font-family: 'Share Tech Mono', monospace; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .price-left .price-num span { font-size: 16px; opacity: 0.7; margin-left: 3px; }
  .price-left .price-delay { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; font-family: 'Share Tech Mono', monospace; }
  .price-right { text-align: right; }
  .change-badge { display: inline-block; font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: 700; border-radius: 10px; padding: 4px 12px; margin-bottom: 4px; }
  .change-up   { background: var(--green-glow); border: 1px solid rgba(0,230,118,0.4); color: var(--green-up); }
  .change-down { background: rgba(255,61,61,0.12); border: 1px solid rgba(255,61,61,0.35); color: var(--red-down); }
  .change-flat { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: var(--white-70); }
  .change-sub  { font-size: 12px; color: var(--white-70); font-family: 'Share Tech Mono', monospace; }
  .price-loading { display: flex; align-items: center; gap: 10px; color: var(--white-70); font-size: 13px; }
  .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.15); border-top-color: var(--green-up); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .anon-bar { display: flex; align-items: center; gap: 8px; background: var(--white-10); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 16px; font-size: 13px; color: var(--white-70); margin-bottom: 1.5rem; }

  .vote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 1.75rem; }
  .vote-btn { background: var(--white-10); border: 2px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 1.75rem 1rem; text-align: center; cursor: pointer; transition: transform 0.15s, border-color 0.15s, background 0.15s; -webkit-tap-highlight-color: transparent; user-select: none; }
  .vote-btn:hover { transform: translateY(-3px); }
  .vote-btn:active { transform: scale(0.96); }
  .vote-btn.buy  { border-color: rgba(0,230,118,0.5); background: rgba(0,230,118,0.07); }
  .vote-btn.sell { border-color: rgba(255,61,61,0.5);  background: rgba(255,61,61,0.07); }
  .vote-btn .v-emoji { font-size: 44px; display: block; margin-bottom: 10px; }
  .vote-btn .v-label { font-family: 'Black Han Sans', sans-serif; font-size: 22px; display: block; margin-bottom: 4px; }
  .vote-btn.buy  .v-label { color: var(--green-up); }
  .vote-btn.sell .v-label { color: var(--red-down); }
  .vote-btn .v-sub { font-size: 12px; color: var(--white-70); }
  .vote-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .results-box { background: var(--white-10); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 1.25rem 1.5rem; }
  .results-title { font-size: 13px; color: var(--white-70); margin-bottom: 1rem; display: flex; align-items: center; gap: 6px; }
  .result-row { margin-bottom: 12px; }
  .result-row:last-child { margin-bottom: 0; }
  .result-meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .result-meta .r-name { color: var(--white); font-weight: 500; }
  .result-meta .r-pct  { color: var(--white-70); font-family: 'Share Tech Mono', monospace; }
  .bar-track { height: 8px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; }
  .bar-fill  { height: 100%; border-radius: 999px; transition: width 0.7s cubic-bezier(.4,0,.2,1); }
  .bar-green { background: linear-gradient(90deg, #00c853, #00e676); }
  .bar-red   { background: linear-gradient(90deg, #d32f2f, #ff3d3d); }
  .total-note { text-align: center; font-size: 12px; color: var(--white-70); margin-top: 12px; font-family: 'Share Tech Mono', monospace; }

  /* 이미 투표한 경우 */
  .already-box { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--white-70); }
  .already-box svg { flex-shrink: 0; color: var(--green-up); }

  #thanks-view { display: none; }
  .thanks-hero { text-align: center; padding: 1.5rem 0 1rem; }
  .thanks-emoji { font-size: 64px; display: block; margin-bottom: 0.75rem; animation: popIn 0.5s cubic-bezier(.4,0,.2,1) both; }
  .thanks-hero h2 { font-family: 'Black Han Sans', sans-serif; font-size: 28px; margin-bottom: 0.4rem; }
  .thanks-hero p  { font-size: 14px; color: var(--white-70); margin-bottom: 1.25rem; }
  .my-vote-badge { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 8px 20px; font-size: 14px; font-weight: 500; margin-bottom: 1.75rem; }
  .badge-buy  { background: rgba(0,230,118,0.15); border: 1px solid rgba(0,230,118,0.4); color: var(--green-up); }
  .badge-sell { background: rgba(255,61,61,0.12);  border: 1px solid rgba(255,61,61,0.35); color: var(--red-down); }

  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="ticker-wrap">
  <div class="ticker-track" id="ticker-track">
    <span>📡 삼성전자 주가 불러오는 중...</span>
    <span>📡 삼성전자 주가 불러오는 중...</span>
  </div>
</div>

<div class="page">
  <div id="vote-view">
    <div class="header">
      <div class="header-badge">🏦 계모임 긴급 주주총회</div>
      <h1>계돈을 삼성전자에<br><em>넣을 것인가?</em></h1>
      <p class="header-sub">친구들과 함께 결정하는 민주적 투자 🗳️</p>
    </div>

    <div class="price-card" id="price-card">
      <div class="price-loading"><div class="spinner"></div><span>주가 불러오는 중...</span></div>
    </div>

    <div id="already-notice" style="display:none;">
      <div class="already-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        이미 투표하셨어요! 아래에서 현재 결과를 확인하세요.
      </div>
    </div>

    <div class="anon-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      익명 투표 · IP 기반 중복 방지
    </div>

    <div class="vote-grid">
      <button class="vote-btn buy"  id="btn-buy"  onclick="castVote('buy')">
        <span class="v-emoji">🚀</span>
        <span class="v-label">산다!</span>
        <span class="v-sub">지금이 기회다</span>
      </button>
      <button class="vote-btn sell" id="btn-sell" onclick="castVote('sell')">
        <span class="v-emoji">🙅</span>
        <span class="v-label">안 산다</span>
        <span class="v-sub">좀 더 지켜보자</span>
      </button>
    </div>

    <div class="results-box">
      <div class="results-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        현재 투표 현황
      </div>
      <div id="bars-preview"></div>
      <div class="total-note" id="total-preview"></div>
    </div>
  </div>

  <div id="thanks-view">
    <div class="thanks-hero">
      <span class="thanks-emoji" id="t-emoji">🎉</span>
      <h2>투표 완료!</h2>
      <p>소중한 의견 감사해요 😄</p>
      <div id="t-badge"></div>
    </div>
    <div class="results-box">
      <div class="results-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        실시간 투표 현황
      </div>
      <div id="bars-result"></div>
      <div class="total-note" id="total-result"></div>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, points = [];
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    points = [];
    for (let i = 0; i < 14; i++) {
      points.push({ x: (i/13)*W, y: H*0.55-(i/13)*H*0.35+(Math.random()-0.5)*H*0.08, vy: (Math.random()-0.5)*0.3 });
    }
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    points.forEach((p,i) => {
      if(i===0||i===points.length-1) return;
      p.y+=p.vy; if(p.y<H*0.1||p.y>H*0.75) p.vy*=-1;
    });
    ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y);
    for(let i=1;i<points.length;i++){const prev=points[i-1],cur=points[i],cpx=(prev.x+cur.x)/2;ctx.bezierCurveTo(cpx,prev.y,cpx,cur.y,cur.x,cur.y);}
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,100,255,0.07)');g.addColorStop(1,'rgba(0,100,255,0)');ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);
    for(let i=1;i<points.length;i++){const prev=points[i-1],cur=points[i],cpx=(prev.x+cur.x)/2;ctx.bezierCurveTo(cpx,prev.y,cpx,cur.y,cur.x,cur.y);}
    ctx.strokeStyle='rgba(0,180,255,0.18)';ctx.lineWidth=2;ctx.stroke();
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize); resize(); draw();
})();
</script>

<script>
// ── 주가 ──
async function fetchStockPrice() {
  try {
    const res = await fetch('/.netlify/functions/stock');
    if (!res.ok) throw new Error('stock function error');
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    renderPriceCard(d.price, d.change, d.changePct);
    updateTicker(d.price, d.change, d.changePct);
  } catch(e) {
    renderPriceFallback();
  }
}

function renderPriceCard(price, change, changePct) {
  const isUp=change>0.5, isDown=change<-0.5;
  const arrow=isUp?'▲':(isDown?'▼':'—');
  const cls=isUp?'change-up':(isDown?'change-down':'change-flat');
  const sign=isUp?'+':'';
  document.getElementById('price-card').innerHTML = `
    <div class="price-left">
      <div class="ticker-code">KRX : 005930 · 삼성전자</div>
      <div class="price-num">${Math.round(price).toLocaleString('ko-KR')}<span>원</span></div>
      <div class="price-delay">※ 15~20분 지연 시세</div>
    </div>
    <div class="price-right">
      <div class="change-badge ${cls}">${arrow} ${sign}${changePct.toFixed(2)}%</div>
      <div class="change-sub">${sign}${Math.round(change).toLocaleString('ko-KR')}원 / 오늘</div>
    </div>`;
}

function renderPriceFallback() {
  document.getElementById('price-card').innerHTML = `
    <div class="price-left">
      <div class="ticker-code">KRX : 005930 · 삼성전자</div>
      <div class="price-num" style="font-size:16px;opacity:0.6">주가 로딩 실패</div>
      <div class="price-delay">잠시 후 새로고침 해주세요</div>
    </div>
    <div class="price-right"><div class="change-badge change-flat">— %</div></div>`;
}

function updateTicker(price, change, changePct) {
  const isUp=change>0.5, sign=isUp?'+':'', arrow=isUp?'▲':'▼';
  const pStr=Math.round(price).toLocaleString('ko-KR');
  const pctStr=sign+changePct.toFixed(2)+'%';
  const items=[
    `🔥 005930 삼성전자  ${pStr}원  ${arrow} ${pctStr}`,
    `📈 HBM 공급 재개 기대감`,`💰 외국인 순매수 동향`,
    `📊 코스피 실시간 현황`,`🏦 계모임 주주총회 진행중`,
    `🔥 005930 삼성전자  ${pStr}원  ${arrow} ${pctStr}`,
    `📈 HBM 공급 재개 기대감`,`💰 외국인 순매수 동향`,
    `📊 코스피 실시간 현황`,`🏦 계모임 주주총회 진행중`,
  ];
  document.getElementById('ticker-track').innerHTML=items.map(t=>`<span>${t}</span>`).join('');
}

// ── 투표 ──
function renderBars(buy, sell, barId, totalId) {
  const total=buy+sell;
  const bp=total===0?50:Math.round((buy/total)*100);
  const sp=100-bp;
  document.getElementById(barId).innerHTML=`
    <div class="result-row">
      <div class="result-meta"><span class="r-name">🚀 산다!</span><span class="r-pct">${bp}%&nbsp;&nbsp;${buy}표</span></div>
      <div class="bar-track"><div class="bar-fill bar-green" style="width:${bp}%"></div></div>
    </div>
    <div class="result-row">
      <div class="result-meta"><span class="r-name">🙅 안 산다</span><span class="r-pct">${sp}%&nbsp;&nbsp;${sell}표</span></div>
      <div class="bar-track"><div class="bar-fill bar-red" style="width:${sp}%"></div></div>
    </div>`;
  document.getElementById(totalId).textContent='총 '+total+'명 참여';
}

function disableButtons() {
  document.getElementById('btn-buy').disabled=true;
  document.getElementById('btn-sell').disabled=true;
}

async function castVote(choice) {
  disableButtons();
  try {
    const res = await fetch('/.netlify/functions/vote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ choice })
    });
    const d = await res.json();

    if (d.alreadyVoted) {
      document.getElementById('already-notice').style.display='block';
      renderBars(d.results.buy, d.results.sell, 'bars-preview', 'total-preview');
      return;
    }

    document.getElementById('vote-view').style.display='none';
    document.getElementById('thanks-view').style.display='block';
    const isBuy=choice==='buy';
    document.getElementById('t-emoji').textContent=isBuy?'🚀':'🤔';
    document.getElementById('t-badge').innerHTML=`
      <div class="my-vote-badge ${isBuy?'badge-buy':'badge-sell'}">
        ${isBuy?'📈 산다에 투표했어요!':'📊 안 산다에 투표했어요!'}
      </div>`;
    renderBars(d.results.buy, d.results.sell, 'bars-result', 'total-result');

  } catch(e) {
    document.getElementById('btn-buy').disabled=false;
    document.getElementById('btn-sell').disabled=false;
    alert('오류가 발생했어요. 다시 시도해주세요.');
  }
}

// 초기 현황 로드
async function loadResults() {
  try {
    const res = await fetch('/.netlify/functions/vote');
    const d = await res.json();
    renderBars(d.buy||0, d.sell||0, 'bars-preview', 'total-preview');
  } catch(e) {
    renderBars(0, 0, 'bars-preview', 'total-preview');
  }
}

fetchStockPrice();
setInterval(fetchStockPrice, 5*60*1000);
loadResults();
</script>
</body>
</html>
